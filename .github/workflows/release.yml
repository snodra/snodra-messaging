name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The JAR uploads attach to an existing release, so it is created first.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES="Maven Central: \`com.damoreira.snodra:snodra-messaging*:${VERSION#v}\`
          JARs: every published module below."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $VERSION" --generate-notes --notes "$NOTES"
          fi

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Nmcp stages every module's publication (sources, javadoc and signatures included), uploads one
      # bundle to the Central Portal and lets it validate and release it.
      - name: publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAggregationToCentralPortal -Pversion="$VERSION" --no-daemon

      - name: the published JARs attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print0 \
            | xargs -0 -r gh release upload "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --clobber
