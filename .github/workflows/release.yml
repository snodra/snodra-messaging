name: release

# CI calls this after it pushes a release tag (ci.yml, job `release`): a tag pushed with
# GITHUB_TOKEN starts no workflow by itself. Run it by hand only to publish an existing tag again;
# nobody pushes tags.
#
# The jobs that hold a write token (prepare, attach) run no build: Gradle and its plugins run only in
# check and publish, which can read the repository and nothing more.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v0.6.0
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release again, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

# The input reaches shells only through this variable, and is printed only once it is checked.
# No build cache here: the jobs that sign and publish build from scratch, with nothing restored from
# other runs (setup-gradle's cache is off below too).
env:
  TAG: ${{ inputs.tag }}
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Every other job needs this one. The tag must be a release version that already exists, and the
  # bundle built from it must carry that version in every module, so a mistyped tag publishes
  # nothing and creates no tag.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: the tag is vN.N.N
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the tag input is not a release tag shaped vN.N.N"
            exit 1
          fi
      # The current scripts and every tag (the tag's own tree may predate scripts/).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag exists, and whether it is the highest
        id: tag
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::the tag $TAG does not exist"
            exit 1
          fi
          highest=$(git tag --list 'v*' | scripts/last-tag.sh)
          # Later jobs check out this commit, not the tag name: what is published is what was checked.
          echo "commit=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$TAG" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$TAG; highest release tag: $highest"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tag.outputs.commit }}
          path: tag
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      # The same build as the publish job, without the signing secrets.
      - name: the bundle built from the tag carries its version
        working-directory: tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./gradlew nmcpZipAggregation -Pversion="$VERSION" --no-daemon
          ../scripts/check-bundle.sh build/nmcp/zip/aggregation.zip "$VERSION" .

  # The release is created as a draft: it becomes public in `attach`, once Maven Central took the
  # version, so a failed publish never leaves a public release naming coordinates that do not exist.
  prepare:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          NOTES="Maven Central: \`com.damoreira.snodra:snodra-messaging*:$VERSION\`
          JARs: every published module below."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --notes "$NOTES"
          else
            # --verify-tag: never create a tag here.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --generate-notes --notes "$NOTES"
          fi

  # Builds, signs and publishes with read access only; the JARs go to `attach` as an artifact.
  publish:
    needs: [check, prepare]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      # Maven Central never takes a version twice, so a repeated run skips the upload of a version
      # it already has and only finishes the GitHub release. The bundle is one deployment: either
      # every module is there or none is.
      - name: is the version on Maven Central already
        id: central
        run: |
          found=0 missing=0
          for f in */build.gradle.kts; do
            grep -q 'maven-publish' "$f" || continue
            m=${f%%/*}
            url="https://repo1.maven.org/maven2/com/damoreira/snodra/$m/$VERSION/$m-$VERSION.pom"
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            case $code in
              200) found=$((found + 1)) ;;
              404) missing=$((missing + 1)) ;;
              *) echo "::error::Maven Central answered $code for $url"; exit 1 ;;
            esac
          done
          if [ "$found" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::$found modules of $VERSION are on Maven Central and $missing are not"
            exit 1
          fi
          echo "published=$([ "$found" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$VERSION on Maven Central: $found modules found, $missing missing"

      # Nmcp stages every module's publication (sources, javadoc and signatures included), uploads one
      # bundle to the Central Portal and lets it validate and release it.
      - name: publish to Maven Central
        if: steps.central.outputs.published == 'false'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAggregationToCentralPortal -Pversion="$VERSION" --no-daemon

      - name: the JARs of a version already published
        if: steps.central.outputs.published == 'true'
        run: |
          echo "::notice::$VERSION is on Maven Central already; only the GitHub release is completed"
          ./gradlew nmcpZipAggregation -Pversion="$VERSION" --no-daemon

      - name: the JARs for the GitHub release
        run: |
          # The main JAR of every published module, at this version (not sources or javadoc).
          mkdir "$RUNNER_TEMP/jars"
          for f in */build.gradle.kts; do
            grep -q 'maven-publish' "$f" || continue
            m=${f%%/*}
            cp "$m/build/libs/$m-$VERSION.jar" "$RUNNER_TEMP/jars/"
          done
          ls "$RUNNER_TEMP/jars"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jars
          path: ${{ runner.temp }}/jars/*.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Holds the write token and runs only gh: attaches the JARs and makes the draft public.
  attach:
    needs: [check, prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jars
          path: jars
      - name: the JARs attach to the release, which becomes public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          gh release upload "$TAG" jars/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"
