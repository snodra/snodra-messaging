name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch keeps only its newest run. On main the runs queue instead: a run that is releasing must
# finish, and the next one then starts from the tag it pushed. The event is part of the group, so a
# run started by hand never replaces a pending push run on main (only push runs release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash -eo pipefail: a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # The hub end-to-end tests use this image, pulled from Docker Hub by the jobs that need it.
  SNODRA_SERVER_IMAGE: snodra-server:dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew assemble --no-daemon

  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: snodra/snodra-server
          ref: ${{ vars.SNODRA_SERVER_REF || 'main' }}
          path: server
          persist-credentials: false
      - name: hub.proto must equal the server's
        run: SNODRA_PROTO_SYNC_REQUIRED=true SNODRA_PROTO_SOURCE="$GITHUB_WORKSPACE/server/proto/hub.proto" bash scripts/check-proto-sync.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: the server image the end-to-end tests need
        env:
          SERVER_VERSION: ${{ vars.SNODRA_SERVER_VERSION || '0.6.0' }}
        run: |
          docker pull "snodra/snodra-server:$SERVER_VERSION"
          docker tag "snodra/snodra-server:$SERVER_VERSION" snodra-server:dev
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew test --no-daemon

  throughput:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: the server image the end-to-end tests need
        env:
          SERVER_VERSION: ${{ vars.SNODRA_SERVER_VERSION || '0.6.0' }}
        run: |
          docker pull "snodra/snodra-server:$SERVER_VERSION"
          docker tag "snodra/snodra-server:$SERVER_VERSION" snodra-server:dev
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew throughputTest --no-daemon

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: for t in scripts/*.test.sh; do sh "$t" || exit 1; done

  # Versions are cut here, from the Conventional Commit subjects since the last tag
  # (scripts/next-version.sh): feat -> minor, fix/perf -> patch, anything else -> no release.
  # Below 1.0.0 nothing computes a major; 1.0.0 is declared by hand.
  # The build takes its version from the tag (-Pversion at release time), so a release is a tag on
  # the tested commit: no file holds the version and no release commit is made.
  version:
    needs: [build, proto-sync, test, throughput, scripts]
    # Pushes to main of this repository only: never a fork, a pull request or a run started by hand.
    # There is no release commit to skip, and the tag CI pushes with GITHUB_TOKEN starts no workflow.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository_owner == 'snodra'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: next version
        id: next
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $main, not $GITHUB_SHA: a newer push releases it. Nothing to do. To finish a failed release, re-run its failed jobs or run the release workflow with the tag."
            exit 0
          fi
          last=$(git tag --merged HEAD --list 'v*' | scripts/last-tag.sh)
          range=${last:+$last..}HEAD
          version=$(
            { git log --format=%s "$range"
              git log -E --grep='^BREAKING[ -]CHANGE:' --format='BREAKING CHANGE: %h' "$range"
            } | scripts/next-version.sh "$last"
          )
          echo "last tag: ${last:-none}; next version: ${version:-none, no release}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The packaging check: the bundle Maven Central would get must build with the computed version
  # before the tag exists. Read-only and without the signing secrets (the build then skips the
  # signatures); the tag job, which may push, runs no build.
  package:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: the bundle builds and carries the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew nmcpZipAggregation -Pversion="$VERSION" --no-daemon
          scripts/check-bundle.sh build/nmcp/zip/aggregation.zip "$VERSION"

  tag:
    needs: [version, package]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      # Keeps its credentials: this job pushes. It runs no build and no action after this one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: tag and push
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          # A re-run after the push landed: the tag is this run's, on the tested commit.
          if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)" = "$GITHUB_SHA" ]; then
            echo "::notice::$tag is already on $GITHUB_SHA; releasing it"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved to $main during the release; the run for the newer commit releases"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists outside main's history; nothing was tagged"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "${GITHUB_REPOSITORY#*/} $tag"
          if ! git push origin "refs/tags/$tag"; then
            # The commit the remote tag names (the peeled line of an annotated tag comes last).
            remote=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f1)
            if [ "$remote" = "$GITHUB_SHA" ]; then
              # The push landed and only the client saw an error: release it.
              echo "::warning::git reported an error, but $tag is on the remote"
            elif [ -n "$remote" ]; then
              echo "::error::$tag is on the remote, but on $remote, not $GITHUB_SHA"
              exit 1
            else
              echo "::error::the tag push was refused: check that github-actions may create v* tags"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN starts no workflow, so the release runs here.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
