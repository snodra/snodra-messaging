# Defaults point at the published ports of the umbrella compose (kraken/infra), so `bootRun` works from the IDE;
# compose.local.yaml overrides them with in-network addresses.
snodra:
  messaging:
    service-name: ${SNODRA_SERVICE_NAME:service-b}
    type-prefix: ${SNODRA_SERVICE_NAME:service-b}
    hub:
      address: ${SNODRA_SERVER_ADDRESS:static://localhost:7002}
    kafka:
      bootstrap-servers: ${SNODRA_KAFKA_BOOTSTRAP:localhost:9092}
    external:
      kafka:
        sources:
          printer:                                  # the fake printer's own topic (created by compose.local.yaml); the bean `printer` translates it
            topic: ${PRINTER_TOPIC:printer.events}
examples:
  printer:
    url: ${PRINTER_URL:http://localhost:8093}
    # Dev-only value shared with the fake printer (compose.local.yaml sets both); not a secret.
    webhook-secret: ${PRINTER_WEBHOOK_SECRET:dev-only-printer-webhook-secret}
spring:
  application:
    name: ${SNODRA_SERVICE_NAME:service-b}
  mongodb:
    uri: ${SNODRA_MONGODB_URI:mongodb://localhost:27017/service-b?replicaSet=rs0&directConnection=true}
management:
  otlp:
    metrics:
      export:
        # Metrics over OTLP/HTTP (the sandbox's otel-lgtm) only when switched on: without a collector the export would log a
        # failure every step. The library makes the export's time unit seconds and its resource the service and the
        # instance id the hub sees (ADR 0026).
        enabled: ${SNODRA_OTLP_METRICS_ENABLED:false}
        url: ${SNODRA_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${SNODRA_OTLP_METRICS_STEP:60s}
server:
  port: ${SERVER_PORT:8092}
logging:
  level:
    com.damoreira.snodra: INFO
