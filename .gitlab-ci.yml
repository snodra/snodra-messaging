# Shell-executor pipeline: the runners have Java 25, Gradle, Docker and buildx installed.
# Images and services are intentionally not used; Testcontainers talks to the host daemon.

stages:
  - build
  - test
  - publish
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  TESTCONTAINERS_RYUK_DISABLED: "true"

build:
  stage: build
  script:
    - ./gradlew assemble --no-daemon

# src/main/proto/hub.proto must stay byte-identical to the umbrella's kraken/protocol/hub.proto.
proto-sync:
  stage: build
  script:
    - |
      export GIT_ASKPASS="$CI_PROJECT_DIR/.git-askpass"
      cat > "$GIT_ASKPASS" <<'EOF'
      #!/bin/sh
      case "$1" in
        Username*) echo "$KRAKEN_UMBRELLA_DEPLOY_USER" ;;
        Password*) echo "$KRAKEN_UMBRELLA_DEPLOY_TOKEN" ;;
      esac
      EOF
      chmod +x "$GIT_ASKPASS"
      rm -rf "$CI_PROJECT_DIR/../kraken"
      git clone --depth 1 "https://${CI_SERVER_HOST}/kraken-org/kraken.git" "$CI_PROJECT_DIR/../kraken"
      KRAKEN_PROTO_SYNC_REQUIRED=true KRAKEN_PROTO_SOURCE="$CI_PROJECT_DIR/../kraken/protocol/hub.proto" bash scripts/check-proto-sync.sh

test:
  stage: test
  script:
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/TEST-*.xml"

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - ./gradlew :kraken-messaging-api:publish :kraken-messaging:publish :kraken-messaging-test:publish --no-daemon -Pversion="$VERSION"

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      PAYLOAD=$(jq -n \
        --arg name "$CI_PROJECT_NAME $CI_COMMIT_TAG" \
        --arg tag "$CI_COMMIT_TAG" \
        --arg desc "Maven release $VERSION: io.damoreira.kraken:kraken-messaging, kraken-messaging-api and kraken-messaging-test in Nexus maven-releases." \
        '{name:$name,tag_name:$tag,description:$desc}')
      curl --fail --silent --show-error \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$PAYLOAD" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
